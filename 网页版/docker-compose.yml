services:
  mysql:
    image: mysql:8.4
    container_name: luying-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: luying
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - luying_mysql_data:/var/lib/mysql
      - ./backend/sql:/seed:ro
      - ./backend/docker/mysql/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: luying-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/luying?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "18081:8080"

  frontend:
    build:
      context: ./frontend
    container_name: luying-frontend
    depends_on:
      - backend
    ports:
      - "18080:80"

volumes:
  luying_mysql_data:
